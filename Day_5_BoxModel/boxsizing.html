<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box sizing</title>
    <style>
        *{
               box-sizing: border-box;
            
        }
        body{
            font-family: 'Courier New', Courier, monospace;
        }
        .div{
            border: 2px solid black;
            height: 200px;
            width: 200px;
            text-align: center;
            line-height: 180px;
            background-color: lightseagreen;
            padding: 20px;
        
        }
        h1{
            border: 3px solid green;
            height: 200px;
            width:120px;
            padding:10px;
        }
    </style>
</head>
<body>

    <div class="div">Box-sizing</div>
    <h1>Hello</h1>
    
</body>
</html>
