<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont{
            border: 5px solid red;
            height: 300px;
            width: 600px;
            display: flex;
            margin: auto;
            gap: 10px;
            
        }
        .bx{
            border: 2px solid green;
            height: 100px;
            width: 100px;
        }
        .bx1{
            flex-basis: 200px;
          flex-grow: 1;
        }
        .bx2{
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="cont">
        <div class="bx bx1">box1</div>
        <div class="bx bx2">box2</div>
        <div class="bx bx3">box3</div>
    </div>
    
</body>
</html>
